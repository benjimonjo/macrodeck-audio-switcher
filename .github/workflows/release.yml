# Publishes to the Macro Deck Creator Portal. Runs when you publish a GitHub release (tag vX.Y.Z);
# the build then shows up under Builds in the portal. No secrets needed.
name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    uses: Macro-Deck-App/GitHub-Actions/.github/workflows/publish-plugin.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ github.event.release.tag_name }}
      source: src/AudioSwitcher
      changelog: ${{ github.event.release.body }}
      run-tests: false
