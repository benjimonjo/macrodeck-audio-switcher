# Publishes to the Macro Deck Creator Portal. Runs when you publish a GitHub release (tag vX.Y.Z);
# the build then shows up under Builds in the portal. No secrets needed.
name: Release

on:
  release:
    types: [published]
  # Manual re-run for an existing tag: Actions -> Release -> Run workflow -> pick the tag (not a branch),
  # or: gh workflow run release.yml --ref v1.0.0
  workflow_dispatch:

jobs:
  publish:
    uses: Macro-Deck-App/GitHub-Actions/.github/workflows/publish-plugin.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ github.event.release.tag_name || github.ref_name }}
      source: src/AudioSwitcher
      changelog: ${{ github.event.release.body }}
      run-tests: false
      # Pin a released CLI: the default packed with a 3.0.0 beta, which the portal refuses.
      cli-version: 3.0.0
