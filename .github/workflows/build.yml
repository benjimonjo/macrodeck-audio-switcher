# Checks every push and pull request: compiles, packs and validates the plugin, and keeps the
# .macroDeckPlugin as a download on the run. Publishing is done by release.yml.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'src/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install the Macro Deck plugin CLI
        run: |
          dotnet tool install --global MacroDeck.Plugin.Cli || dotnet tool install --global MacroDeck.Plugin.Cli --prerelease
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build, pack and validate
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: audio-switcher-ci-${{ github.run_number }}
          path: artifacts/*.macroDeckPlugin
          if-no-files-found: error
